<body data-tool="xml-format">
<main class="s3-main">
  <section class="s3-hero">
    <h1>XML Format</h1>
    <p>Validate, pretty-print, minify and query XML, or turn it into JSON. The XML is parsed as data and never rendered as a page.</p>
  </section>

  <div class="grid-2 xf-grid">
    <section class="card stack">
      <div class="row between">
        <h2>Input</h2>
        <div class="row">
          <button class="btn ghost small" id="sample">Sample</button>
          <label class="btn ghost small" id="open">Open file<input type="file" accept=".xml,.svg,.xsd,.xsl,.xslt,.rss,.atom,.plist,.config,.csproj,.txt,application/xml,text/xml,text/plain" hidden></label>
          <button class="btn ghost small" id="clear">Clear</button>
        </div>
      </div>
      <label class="field"><span class="sr">XML input</span>
        <textarea class="textarea" id="input" spellcheck="false" dir="auto" placeholder="Paste XML here, e.g. &lt;note&gt;&lt;to&gt;Omar&lt;/to&gt;&lt;/note&gt;"></textarea>
      </label>
      <div class="row xf-opts">
        <label class="field">Indent
          <select class="select" id="indent">
            <option value="2">2 spaces</option>
            <option value="4">4 spaces</option>
            <option value="tab">Tab</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="nocom"> Remove comments</label>
      </div>
      <div class="row">
        <button class="btn primary" id="format">Format</button>
        <button class="btn" id="minify">Minify</button>
        <span class="grow"></span>
        <span class="chip" id="status">Waiting for XML</span>
      </div>
    </section>

    <section class="card stack">
      <div class="row between">
        <div class="seg" id="view" role="group" aria-label="View">
          <button aria-pressed="true" data-v="text">XML</button>
          <button aria-pressed="false" data-v="tree">Tree</button>
          <button aria-pressed="false" data-v="json">JSON</button>
        </div>
        <div class="row">
          <button class="btn small" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
          <button class="btn small" id="save"><svg class="i"><use href="#i-download"/></svg><span id="ext">.xml</span></button>
        </div>
      </div>
      <pre class="out xf-out" id="out" tabindex="0"></pre>
      <div class="out xf-out xf-tree" id="tree" hidden></div>
      <div class="stats" id="stats"></div>
    </section>
  </div>

  <section class="card stack mt">
    <div class="row between">
      <h2>XPath tester</h2>
      <div class="row" id="ns"></div>
    </div>
    <div class="row xf-xrow">
      <label class="field grow">XPath expression
        <input class="input mono" id="xpath" spellcheck="false" autocomplete="off" value="//book[price &gt; 30]/title">
      </label>
      <button class="btn primary" id="run">Run</button>
    </div>
    <div class="row"><span class="chip" id="xstatus">—</span><span class="faint" id="xinfo"></span></div>
    <div class="xf-results" id="xres"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
